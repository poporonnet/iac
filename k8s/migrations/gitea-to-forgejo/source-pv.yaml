apiVersion: v1
kind: PersistentVolume
metadata:
  name: gitea-forgejo-migration-source
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn-static
  csi:
    driver: driver.longhorn.io
    volumeHandle: gitea-forgejo-migration-source
