apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
spec:
  pollingInterval: 5
  minReplicaCount: 0
  maxReplicaCount: 5
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTargetRef:
    activeDeadlineSeconds: 12600
    backoffLimit: 0
    ttlSecondsAfterFinished: 3600
    template:
      metadata:
        labels:
          app.kubernetes.io/name: forgejo-runner
      spec:
        restartPolicy: Never
        terminationGracePeriodSeconds: 30
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
        volumes:
          - name: config
            secret:
              secretName: forgejo-runner
              defaultMode: 0440
          - name: data
            emptyDir: {}
          - name: docker-certs
            emptyDir: {}
          - name: docker-data
            emptyDir:
              sizeLimit: 20Gi
        initContainers:
          - name: dind
            image: docker:27.5.1-dind
            restartPolicy: Always
            env:
              - name: DOCKER_TLS_CERTDIR
                value: /certs
            securityContext:
              privileged: true
              runAsUser: 0
            startupProbe:
              tcpSocket:
                port: 2376
              failureThreshold: 30
              periodSeconds: 2
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
                ephemeral-storage: 1Gi
              limits:
                memory: 4Gi
                ephemeral-storage: 20Gi
            volumeMounts:
              - name: docker-certs
                mountPath: /certs
              - name: docker-data
                mountPath: /var/lib/docker
        containers:
          - name: runner
            image: data.forgejo.org/forgejo/runner:13.0.0
            args:
              - forgejo-runner
              - one-job
              - --config
              - /config/runner-config.yaml
            env:
              - name: DOCKER_HOST
                value: tcp://localhost:2376
              - name: DOCKER_CERT_PATH
                value: /certs/client
              - name: DOCKER_TLS_VERIFY
                value: "1"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            volumeMounts:
              - name: config
                mountPath: /config
                readOnly: true
              - name: data
                mountPath: /data
              - name: docker-certs
                mountPath: /certs
                readOnly: true
  triggers:
    - type: forgejo-runner
      metadata:
        name: kubernetes-runner
        address: http://forgejo-http.forgejo.svc.cluster.local:3000/
        global: "true"
        labels: ubuntu-latest
      authenticationRef:
        name: forgejo-runner
